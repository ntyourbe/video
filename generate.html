<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Generator Links</title>
</head>
<body>

<h2>Generator Video + Ads</h2>

<textarea id="input" rows="10" cols="50" placeholder="Masukkan ID..."></textarea>
<br><br>

<button onclick="generate()">Generate</button>

<h3>Hasil Links:</h3>
<pre id="output1"></pre>

<h3>Hasil CDN:</h3>
<pre id="output2"></pre>

<script>
function generate() {
  const input = document.getElementById("input").value.split("\n");

  let result1 = "const links = {\n";
  let result2 = "";

  input.forEach(line => {
    if (!line) return;

    let clean = line
      .normalize("NFKC")
      .replace(/[^a-zA-Z0-9_]/g, "")
      .trim();

    if (!clean) return;

    let isAds = clean.includes("ads_");
    let id = clean.replace("ads_", "");

    if (isAds) {
      result1 += `  "${id}.mp4": "https://www.profitablecpmratenetwork.com/tt5siafv2?key=c68575346584e4fd5456385a3409b4f2",\n`;
    } else {
      result1 += `  "${id}.mp4": "https://videy.mvsub.eu.org/play.html?video=https://cdn2.videy.co/${id}.mp4",\n`;
    }

    result2 += `https://cdn2.videoken.eu.org/${id}.mp4\n`;
  });

  result1 += "};";

  document.getElementById("output1").textContent = result1;
  document.getElementById("output2").textContent = result2;
}
</script>

</body>
</html>
