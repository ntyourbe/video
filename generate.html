<h2>Generator Video Links</h2>

<textarea id="input" rows="10" cols="50" placeholder="Masukkan ID video, satu per baris..."></textarea>
<br><br>

<button onclick="generate()">Generate</button>

<pre id="output"></pre>

    if (!id) return;<script>
function cleanText(text) {
  return text
    .replace(/[\u200E\u200F\u202A-\u202E]/g, "") // hapus karakter aneh
    .replace(/\s+/g, "") // hapus semua spasi tersembunyi
    .trim();
}

function generate() {
  const input = document.getElementById("input").value.split("\n");

  let result = "const links = {\n";

  input.forEach(raw => {
    let id = cleanText(raw);
    if (!id) return;

    // deteksi ads walaupun ada karakter aneh
    let isAds = id.includes("ads_");

    // hapus ads_ dari ID
    id = id.replace("ads_", "");

    if (isAds) {
      result += `  "${id}.mp4": "https://www.profitablecpmratenetwork.com/tt5siafv2?key=c68575346584e4fd5456385a3409b4f2",\n`;
    } else {
      result += `  "${id}.mp4": "https://cdn2.videy.co/${id}.mp4",\n`;
    }
  });

  result += "};";

  document.getElementById("output").textContent = result;
}
</script>

</body>
</html>
