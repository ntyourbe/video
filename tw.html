<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click & wait... unlocking private 🔒</title>

<meta property="og:title" content="Click & wait... unlocking private 🔒">
<meta name="twitter:card" content="summary_large_image">

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.thumb{
position:relative;
cursor:pointer;
}

.thumb video{
width:100%;
border-radius:12px;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:white;
text-shadow:0 0 20px black;
}

#timer{
margin-top:20px;
font-size:20px;
}

#player{
display:none;
width:100%;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>Click & wait... unlocking private 🔒</h2>

<div class="thumb" onclick="startUnlock()">
<video id="preview" autoplay muted loop playsinline></video>
<div class="play">▶</div>
</div>

<div id="timer"></div>

<video id="player" controls></video>

</div>

<script>

function getParam(name){
const url = new URL(window.location.href);
return url.searchParams.get(name);
}

let videoURL = getParam("video");

if(!videoURL){
videoURL = "video.mp4";
}

document.getElementById("preview").innerHTML =
'<source src="'+videoURL+'" type="video/mp4">';

document.getElementById("player").innerHTML =
'<source src="'+videoURL+'" type="video/mp4">';


function startUnlock(){

let time = 10;

let timer = document.getElementById("timer");

let countdown = setInterval(function(){

timer.innerHTML = "Unlocking video in "+time+" seconds...";

time--;

if(time < 0){

clearInterval(countdown);

timer.innerHTML = "Video unlocked 🔓";

let v = document.getElementById("player");

v.style.display="block";

v.play();

}

},1000);

}

</script>

</body>
</html>
