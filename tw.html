<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click & wait... unlocking private 🔒</title>

<meta property="og:title" content="Click & wait... unlocking private 🔒">
<meta property="og:image" content="thumb.jpg">
<meta name="twitter:card" content="summary_large_image">

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.video-thumb{
position:relative;
cursor:pointer;
}

.video-thumb video{
width:100%;
border-radius:12px;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:white;
text-shadow:0 0 20px black;
}

#timer{
margin-top:20px;
font-size:20px;
}

#player{
display:none;
width:100%;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>Click & wait... unlocking private 🔒</h2>

<div class="video-thumb" onclick="startUnlock()">

<video autoplay muted loop playsinline>
<source src="https://cdn2.videy.co/JbE5xKfG1.mp4" type="video/mp4">
</video>

<div class="play">▶</div>

</div>

<div id="timer"></div>

<video id="player" controls>
<source src="video.mp4" type="video/mp4">
</video>

</div>

<script>

function startUnlock(){

let time=10;

let timer=document.getElementById("timer");

let countdown=setInterval(function(){

timer.innerHTML="Unlocking video in "+time+" seconds...";

time--;

if(time<0){

clearInterval(countdown);

timer.innerHTML="Video unlocked 🔓";

let v=document.getElementById("player");

v.style.display="block";

v.play();

}

},1000);

}

</script>

</body>
</html>
