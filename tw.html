<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click & wait... unlocking private 🔒</title>

<!-- Twitter Preview -->
<meta property="og:title" content="Click & wait... unlocking private 🔒">
<meta property="og:description" content="Click and wait to unlock private video">
<meta property="og:image" content="thumb.jpg">
<meta name="twitter:card" content="summary_large_image">

<style>

body{
background:#000;
color:white;
font-family:Arial;
margin:0;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.video-box{
position:relative;
cursor:pointer;
}

.video-box img{
width:100%;
border-radius:12px;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:white;
text-shadow:0 0 20px black;
}

#timer{
margin-top:20px;
font-size:20px;
}

video{
display:none;
width:100%;
margin-top:20px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Click & wait... unlocking private 🔒</h2>

<div class="video-box" onclick="startUnlock()">
<img id="thumb" src="thumb.jpg">
<div class="play">▶</div>
</div>

<div id="timer"></div>

<video id="videoPlayer" controls></video>

</div>

<script>

function getParam(name){
const url = new URL(window.location.href);
return url.searchParams.get(name);
}

let videoURL = getParam("video");

if(!videoURL){
videoURL="video.mp4";
}

document.getElementById("videoPlayer").innerHTML =
'<source src="'+videoURL+'" type="video/mp4">';

function startUnlock(){

let time=10; // timer unlock

let timer=document.getElementById("timer");

let countdown=setInterval(function(){

timer.innerHTML="Unlocking video in "+time+" seconds...";

time--;

if(time<0){

clearInterval(countdown);

timer.innerHTML="Video unlocked 🔓";

let v=document.getElementById("videoPlayer");

v.style.display="block";

v.play();

}

},1000);

}

</script>

</body>
</html>
