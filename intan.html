<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click & wait... unlocking private 🔒</title>

<!-- Open Graph -->
<meta property="og:title" content="Click & wait... unlocking private 🔒">
<meta property="og:description" content="Watch the full video">
<meta property="og:image" content="https://videy.mvsub.eu.org/intan.gif">
<meta property="og:url" content="https://videy.mvsub.eu.org/intan.html">
<meta property="og:type" content="website">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Click & wait... unlocking private 🔒">
<meta name="twitter:description" content="Watch the full video">
<meta name="twitter:image" content="https://videy.mvsub.eu.org/intan.gif">

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.player{
position:relative;
cursor:pointer;
}

.player img{
width:100%;
border-radius:12px;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
color:white;
text-shadow:0 0 20px black;
}

.duration{
position:absolute;
bottom:10px;
right:10px;
background:rgba(0,0,0,0.7);
padding:3px 6px;
font-size:14px;
border-radius:4px;
}

#timer{
margin-top:20px;
font-size:20px;
}

video{
display:none;
width:100%;
margin-top:20px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Click & wait... unlocking private 🔒</h2>

<div class="player" onclick="startUnlock()">

<img id="thumb">

<div class="play">▶</div>

<div class="duration">46:03</div>

</div>

<div id="timer"></div>

<video id="player" controls></video>

</div>

<script>

// ============================
// CONFIG
// ============================

let videoURL = "https://cdn2.videy.co/vygRdQks1.mp4";

let thumbURL = "https://videy.mvsub.eu.org/intan.gif";

// ============================

document.getElementById("thumb").src = thumbURL;

document.getElementById("player").innerHTML =
'<source src="'+videoURL+'" type="video/mp4">';


function startUnlock(){

let time = 8;

let timer = document.getElementById("timer");

let countdown = setInterval(function(){

timer.innerHTML="Unlocking video in "+time+" seconds...";

time--;

if(time < 0){

clearInterval(countdown);

timer.innerHTML="Video unlocked 🔓";

let v=document.getElementById("player");

v.style.display="block";

v.play();

}

},1000);

}

</script>

</body>
</html>
