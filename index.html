<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #007bff;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    footer {
      width: 100%;
      background: #f1f1f1;
      color: #333;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.9rem;
      margin-top: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 177.78%; /* Rasio 9:16 */
      height: 0;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 15px;
      max-width: 100%;
    }

    @media (min-width: 600px) {
      .video-container {
        max-width: 600px;
      }
    }

    @media (min-width: 992px) {
      .video-container {
        max-width: 800px;
      }
    }

    .thumbnail, .video-container iframe, .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 16px;
      object-fit: cover;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-button::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-left: 20px solid white;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }

    .download-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }

    .download-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    Download Video
  </header>

  <main>
    <div class="video-container" id="videoBox">
      <!-- Thumbnail default -->
      <img id="thumbnailImg" src="thumbnail-default.jpg" alt="Thumbnail" class="thumbnail">
      <div class="play-button"></div>
    </div>

    <a id="" href="https://www.effectivegatecpm.com/ck2udxnck?key=1a3377c07ee6beb3efdc22e6560b8858" class="download-btn">Download</a>
  </main>

  <footer>
    Â© 2025 Website Video Player
  </footer>

  <script>
    // Ambil parameter URL
    const params = new URLSearchParams(window.location.search);
    const thumbnailUrl = params.get("thumbnail");
    const videoUrl = params.get("video");

    // Thumbnail dari URL jika ada
    if (thumbnailUrl) {
      document.getElementById("thumbnailImg").src = thumbnailUrl;
    }

    // Video default jika tidak ada di URL
    let finalVideoUrl = "https://www.youtube.com/embed/aqz-KE-bpKQ?autoplay=1";
    if (videoUrl) {
      // Jika link .mp4, pakai tag <video>
      if (videoUrl.endsWith(".mp4")) {
        finalVideoUrl = videoUrl;
      } else {
        // Anggap sebagai YouTube embed
        finalVideoUrl = videoUrl.includes("?") ? videoUrl + "&autoplay=1" : videoUrl + "?autoplay=1";
      }
      document.getElementById("downloadBtn").href = videoUrl;
    }

    // Ganti thumbnail jadi video saat diklik
    document.getElementById('videoBox').addEventListener('click', function() {
      if (finalVideoUrl.endsWith(".mp4")) {
        this.innerHTML = `
          <video controls autoplay>
            <source src="${finalVideoUrl}" type="video/mp4">
            Browser kamu tidak mendukung video.
          </video>`;
      } else {
        this.innerHTML = `
          <iframe src="${finalVideoUrl}"
                  title="Video Embed 9:16"
                  allow="autoplay; encrypted-media"
                  allowfullscreen>
          </iframe>`;
      }
    });
  </script>
</body>
</html>
